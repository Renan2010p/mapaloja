# SPDX-License-Identifier: GPL-3.0-or-later
#
# Cria uma Release no GitHub com o APK assinado sempre que uma tag "v*" é enviada:
#   git tag v1.1.0 && git push origin v1.1.0
#
# Secrets necessários (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    arquivo .jks em base64 (base64 -w0 chave.jks)
#   KEYSTORE_PASSWORD  senha do arquivo .jks
#   KEY_ALIAS          apelido da chave dentro do .jks
#   KEY_PASSWORD       senha da chave
# Sem eles, o APK sai assinado com uma chave de debug (serve para testar, não para distribuir).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão a partir da tag
        run: echo "VERSAO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAPALOJA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets de assinatura não configurados: o APK será assinado com chave de debug."
          fi

      - name: Compilar APK
        env:
          MAPALOJA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAPALOJA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAPALOJA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversaoApp="$VERSAO"

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk "mapa-da-loja-$VERSAO.apk"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mapa da Loja ${{ env.VERSAO }}
          files: mapa-da-loja-*.apk
          generate_release_notes: true
